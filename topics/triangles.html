<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="topic_tri">Triángulos</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="wrap">
<header class="topbar">
  <a class="homelink" href="../index.html" data-i18n="home"></a>
  <h1 data-i18n="topic_tri"></h1>
  <button class="lang" id="langBtn"></button>
</header>

<nav class="subtabs">
  <button data-tab="t-sum" class="on" data-i18n="tab1"></button>
  <button data-tab="t-sides" data-i18n="tab2"></button>
  <button data-tab="t-types" data-i18n="tab3"></button>
  <button data-tab="t-area" data-i18n="tab4"></button>
  <button data-tab="t-ex" data-i18n="ex_title"></button>
</nav>

<section id="t-sum" class="on">
  <div class="card">
    <h2 data-i18n="p1_title"></h2>
    <p class="intro" data-i18n="p1_intro"></p>
    <div class="row">
      <div class="fig"><svg id="sv1" class="board drag" viewBox="0 0 600 420"></svg></div>
      <div class="side">
        <svg id="semi" viewBox="0 0 320 205"></svg>
        <div class="eq" id="eq1"></div>
        <p class="tip" data-i18n="p1_try"></p>
        <button class="btn" id="rnd1" data-i18n="btn_random"></button>
      </div>
    </div>
  </div>
</section>

<section id="t-sides">
  <div class="card">
    <h2 data-i18n="p2_title"></h2>
    <p class="intro" data-i18n="p2_intro"></p>
    <div class="row">
      <div class="fig"><svg id="sv2" class="board drag" viewBox="0 0 600 420"></svg></div>
      <div class="side">
        <div class="info" id="info2"></div>
        <button class="btn" id="rnd2" data-i18n="btn_random"></button>
      </div>
    </div>
  </div>
  <div class="card">
    <h2 data-i18n="sticks_title"></h2>
    <p class="intro" data-i18n="sticks_intro"></p>
    <div class="row">
      <div class="fig"><svg id="svSticks" class="board" viewBox="0 0 600 300"></svg></div>
      <div class="side">
        <div class="sliders" id="sliders"></div>
        <div class="status" id="stStatus"></div>
      </div>
    </div>
  </div>
</section>

<section id="t-types">
  <div class="card">
    <h2 data-i18n="p3_title"></h2>
    <p class="intro" data-i18n="p3_intro"></p>
    <div class="row">
      <div class="fig"><svg id="sv3" class="board drag" viewBox="0 0 600 420"></svg></div>
      <div class="side">
        <div class="badge" id="bAng"></div>
        <div class="badge" id="bSide"></div>
        <div>
          <button class="btn" data-preset="equi" data-i18n="equi"></button>
          <button class="btn" data-preset="iso" data-i18n="iso"></button>
          <button class="btn" data-preset="scal" data-i18n="scal"></button>
          <button class="btn" data-preset="right" data-i18n="right"></button>
          <button class="btn" data-preset="obtuse" data-i18n="obtuse"></button>
          <button class="btn" data-preset="acute" data-i18n="acute"></button>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="t-area">
  <div class="card">
    <h2 data-i18n="p4_title"></h2>
    <p class="intro" data-i18n="p4_intro"></p>
    <div class="row">
      <div class="fig"><svg id="sv4" class="board drag" viewBox="0 0 600 400"></svg></div>
      <div class="side">
        <div class="eq" id="eq4" style="font-size:1.3rem"></div>
        <p class="tip" data-i18n="p4_tip"></p>
      </div>
    </div>
  </div>
</section>

<section id="t-ex"><div class="card" id="exTri"></div></section>
<footer></footer>
</div>
<script src="../js/core.js"></script>
<script src="triangles.js"></script>
</body>
</html>
